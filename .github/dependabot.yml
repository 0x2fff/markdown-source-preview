version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      development-types:
        dependency-type: development
        patterns:
          - "@types/markdown-it"
          - "@types/node"
        update-types:
          - patch
          - minor
      development-build-tools:
        dependency-type: development
        patterns:
          - "typescript"
          - "esbuild"
          - "@vscode/vsce"
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "@types/vscode"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
