name: Publish Marketplace Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-latest
    environment:
      name: marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match package version v$VERSION"
            exit 1
          fi
          if [ "$(node -p "require('./package.json').publisher")" != "0x2fff" ]; then
            echo "Unexpected publisher"
            exit 1
          fi
          if [ "$(node -p "require('./package.json').name")" != "markdown-source-preview" ]; then
            echo "Unexpected extension name"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="markdown-source-preview-${VERSION}.vsix"
          npx --no-install @vscode/vsce package --no-dependencies --out "$VSIX"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Publish with Trusted Publishing
        run: |
          npx --no-install @vscode/vsce publish --oidc --packagePath "${{ steps.package.outputs.vsix }}"

      - name: Create checksum
        shell: bash
        run: |
          sha256sum "${{ steps.package.outputs.vsix }}" > SHA256SUMS.txt

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.vsix }}" SHA256SUMS.txt --clobber
